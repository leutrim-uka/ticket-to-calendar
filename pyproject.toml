[project]
name = "ticket-to-calendar"
version = "0.2.0"
description = "Local booking extraction, user review, and Apple Calendar creation via MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "pydantic>=2,<3",
  "streamlit>=1.45,<2",
  "icalendar>=6,<8",
  "tzdata>=2025.1",
  "mcp>=1.20,<2",
]

[tool.uv]
package = false
